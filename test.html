<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>UPSC Shiksha | Free Mock Test</title>
  <meta name="description" content="UPSC Shiksha Free General Studies Practice Test">

  <link rel="stylesheet" href="style.css">

  <style>
    .test-page {
      max-width: 900px;
      margin: auto;
      padding: 25px 15px 60px;
    }

    .test-header {
      background: linear-gradient(135deg, #172554, #2563eb);
      color: white;
      padding: 30px 20px;
      border-radius: 18px;
      text-align: center;
      margin-bottom: 20px;
    }

    .test-header h1 {
      margin: 0 0 10px;
      font-size: 30px;
    }

    .test-header p {
      margin: 0;
    }

    .test-info {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin: 15px 0;
      flex-wrap: wrap;
    }

    .info-card {
      flex: 1;
      min-width: 120px;
      background: #f1f5f9;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      font-weight: bold;
    }

    .timer {
      color: #dc2626;
      font-size: 22px;
    }

    .progress-box {
      background: #e5e7eb;
      height: 10px;
      border-radius: 20px;
      overflow: hidden;
      margin: 20px 0;
    }

    .progress {
      height: 100%;
      width: 4%;
      background: #2563eb;
      transition: width 0.3s;
    }

    .question-card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      margin-top: 20px;
    }

    .question-number {
      color: #2563eb;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .question-text {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .option {
      display: block;
      padding: 14px;
      margin: 10px 0;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    .option:hover {
      border-color: #2563eb;
      background: #eff6ff;
    }

    .option input {
      margin-right: 10px;
    }

    .test-buttons {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 25px;
    }

    .test-buttons button,
    .result button {
      border: none;
      padding: 13px 22px;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .test-buttons button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .submit-btn {
      background: #16a34a !important;
    }

    .result {
      display: none;
      background: white;
      padding: 30px 20px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .result h2 {
      color: #2563eb;
    }

    .score {
      font-size: 42px;
      font-weight: bold;
      margin: 15px 0;
    }

    .result-details {
      font-size: 18px;
      line-height: 1.8;
    }

    .home-btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 22px;
      background: #172554;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }

    body.dark-mode-test {
      background: #0f172a;
      color: #e5e7eb;
    }

    body.dark-mode-test .question-card,
    body.dark-mode-test .result {
      background: #1e293b;
      color: #e5e7eb;
    }

    body.dark-mode-test .info-card {
      background: #334155;
    }

    body.dark-mode-test .option {
      border-color: #475569;
    }

    body.dark-mode-test .option:hover {
      background: #334155;
    }

    .dark-btn {
      display: block;
      margin: 0 auto 15px;
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .test-header h1 {
        font-size: 24px;
      }

      .question-card {
        padding: 18px;
      }

      .question-text {
        font-size: 18px;
      }

      .test-buttons button {
        padding: 11px 14px;
        font-size: 14px;
      }
    }
    .question-nav {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 15px 0;
  padding: 15px;
  background: #f1f5f9;
  border-radius: 12px;
}

.question-nav button {
  width: 42px;
  height: 42px;
  border: none;
  border-radius: 8px;
  background: white;
  color: #334155;
  font-weight: bold;
  cursor: pointer;
  border: 1px solid #cbd5e1;
}

.question-nav button.current {
  background: #2563eb;
  color: white;
}

.question-nav button.answered {
  background: #16a34a;
  color: white;
}

body.dark-mode-test .question-nav {
  background: #1e293b;
}

body.dark-mode-test .question-nav button {
  background: #334155;
  color: white;
  border-color: #475569;
}
  </style>
</head>

<body>

  <div class="test-page">

    <button class="dark-btn" id="darkBtn">🌙 Dark Mode</button>

    <div class="test-header">
      <h1>📝 UPSC General Studies Mock Test</h1>
      <p>UPSC Shiksha – Practice Test</p>
    </div>

    <div class="test-info">
      <div class="info-card">
        Questions<br>
        <span>25</span>
      </div>

        Time<br>
        <span class="timer" id="timer">20:00</span>
      </div>

      <div class="info-card">
        Question<br>
        <span id="questionCounter">1 / 25</span>
      </div>
    </div>

    <div class="progress-box">
      <div class="progress" id="progress"></div>
    </div>
    <div class="question-nav" id="questionNav"></div>

    <div class="question-card" id="quizBox">

      <div class="question-number" id="questionNumber">
        Question 1
      </div>

      <div class="question-text" id="questionText"></div>

      <div id="options"></div>

      <div class="test-buttons">
        <button id="prevBtn" onclick="previousQuestion()">
          ← Previous
        </button>

        <button id="nextBtn" onclick="nextQuestion()">
          Next →
        </button>

        <button class="submit-btn" id="submitBtn" onclick="submitTest()" style="display:none;">
          Submit Test
        </button>
      </div>

    </div>

    <div class="result" id="resultBox">

      <h2>🎉 Test Completed!</h2>

      <div class="score" id="score"></div>

      <div class="result-details">
        <div>✅ Correct: <b id="correct"></b></div>
        <div>❌ Incorrect: <b id="incorrect"></b></div>
        <div>⚪ Unattempted: <b id="unattempted"></b></div>
        <div>📊 Percentage: <b id="percentage"></b></div>
      </div>
      <div id="answerReview" class="answer-review"></div>

      <button onclick="location.reload()">
        🔄 Retry Test
      </button>

      <br>

      <a href="index.html" class="home-btn">
        🏠 Back to Home
      </a>

    </div>

  </div>

let currentQuestion = 0;
let userAnswers = new Array(questions.length).fill(null);

let timeLeft = 20 * 60;
let timerInterval;

function loadQuestion() {

  const question = questions[currentQuestion];

  document.getElementById("questionNumber").textContent =
    "Question " + (currentQuestion + 1);

  document.getElementById("questionCounter").textContent =
    (currentQuestion + 1) + " / " + questions.length;

  document.getElementById("questionText").textContent =
    question.q;

  const optionsBox = document.getElementById("options");
  optionsBox.innerHTML = "";

  question.options.forEach((option, index) => {

    const label = document.createElement("label");
    label.className = "option";

    label.innerHTML =
      '<input type="radio" name="answer" value="' + index + '">' +
      option;

    optionsBox.appendChild(label);

  });

  if (userAnswers[currentQuestion] !== null) {

    const selected =
      document.querySelector(
        'input[name="answer"][value="' +
        userAnswers[currentQuestion] +
        '"]'
      );

    if (selected) {
      selected.checked = true;
    }

  }

  document.getElementById("prevBtn").disabled =
    currentQuestion === 0;

  document.getElementById("nextBtn").style.display =
    currentQuestion === questions.length - 1
      ? "none"
      : "inline-block";

  document.getElementById("submitBtn").style.display =
    currentQuestion === questions.length - 1
      ? "inline-block"
      : "none";

  const progress =
    ((currentQuestion + 1) / questions.length) * 100;

  document.getElementById("progress").style.width =
    progress + "%";
}


function saveAnswer() {

  const selected =
    document.querySelector('input[name="answer"]:checked');

  if (selected) {
    userAnswers[currentQuestion] =
      Number(selected.value);
  }

}


function nextQuestion() {

  saveAnswer();

  if (currentQuestion < questions.length - 1) {

    currentQuestion++;

    loadQuestion();
    updateQuestionNav();

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }

}


function previousQuestion() {

  saveAnswer();

  if (currentQuestion > 0) {

    currentQuestion--;

    loadQuestion();
    updateQuestionNav();

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }

}


function submitTest() {

  saveAnswer();

  clearInterval(timerInterval);

  let correct = 0;
  let incorrect = 0;
  let unattempted = 0;

  questions.forEach((question, index) => {

    if (userAnswers[index] === null) {

      unattempted++;

    } else if (userAnswers[index] === question.answer) {

      correct++;

    } else {

      incorrect++;

    }

  });

  const percentage =
    ((correct / questions.length) * 100).toFixed(2);

  document.getElementById("quizBox").style.display = "none";

  document.querySelector(".test-info").style.display = "none";

  document.querySelector(".progress-box").style.display = "none";

  document.getElementById("resultBox").style.display = "block";

  document.getElementById("correct").textContent = correct;

  document.getElementById("incorrect").textContent = incorrect;

  document.getElementById("unattempted").textContent = unattempted;

  document.getElementById("percentage").textContent =
    percentage + "%";

  document.getElementById("score").textContent =
    correct + " / " + questions.length;
  const reviewBox = document.getElementById("answerReview");

let reviewHTML = "<h3>📚 Answer Review</h3>";

questions.forEach((question, index) => {

  const userAnswer = userAnswers[index];

  reviewHTML += `
    <div style="
      text-align:left;
      padding:15px;
      margin:12px 0;
      border-radius:12px;
      background:#f8fafc;
      border:1px solid #e2e8f0;
    ">

      <b>Q${index + 1}. ${question.q}</b>

      <p>
        Your Answer:
        <strong>
          ${
            userAnswer === null
              ? "Not Attempted"
              : question.options[userAnswer]
          }
        </strong>
      </p>

      <p>
        Correct Answer:
        <strong style="color:#16a34a;">
          ${question.options[question.answer]}
        </strong>
      </p>
      <p>
  💡 Explanation:
  <span>${question.explanation}</span>
</p>

      ${
        userAnswer === question.answer
          ? '<span style="color:#16a34a;font-weight:bold;">✅ Correct</span>'
          : userAnswer === null
            ? '<span style="color:#ca8a04;font-weight:bold;">⚪ Not Attempted</span>'
            : '<span style="color:#dc2626;font-weight:bold;">❌ Incorrect</span>'
      }

    </div>
  `;

});

reviewBox.innerHTML = reviewHTML;

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


function updateTimer() {

  const minutes =
    Math.floor(timeLeft / 60);

  const seconds =
    timeLeft % 60;

  document.getElementById("timer").textContent =
    String(minutes).padStart(2, "0") +
    ":" +
    String(seconds).padStart(2, "0");

  if (timeLeft <= 0) {

    clearInterval(timerInterval);

    alert("⏰ Time is over! Your test will be submitted automatically.");

    submitTest();

    return;
  }

  timeLeft--;

}


document.getElementById("darkBtn")
.addEventListener("click", function() {

  document.body.classList.toggle("dark-mode-test");

  this.textContent =
    document.body.classList.contains("dark-mode-test")
      ? "☀️ Light Mode"
      : "🌙 Dark Mode";

});

function createQuestionNav() {

  const nav = document.getElementById("questionNav");

  nav.innerHTML = "";

  questions.forEach((question, index) => {

    const button = document.createElement("button");

    button.textContent = index + 1;

    button.id = "navBtn" + index;

    button.addEventListener("click", function() {

      saveAnswer();

      currentQuestion = index;

      loadQuestion();

      updateQuestionNav();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    });

    nav.appendChild(button);

  });

}


function updateQuestionNav() {

  questions.forEach((question, index) => {

    const button =
      document.getElementById("navBtn" + index);

    if (!button) return;

    button.classList.remove("current");
    button.classList.remove("answered");

    if (index === currentQuestion) {
      button.classList.add("current");
    }

    if (userAnswers[index] !== null) {
      button.classList.add("answered");
    }

  });

}
createQuestionNav();

loadQuestion();

updateQuestionNav();

updateTimer();

timerInterval =
  setInterval(updateTimer, 1000);

</script>

</body>
</html>
